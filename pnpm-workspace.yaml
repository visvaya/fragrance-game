packages:
  - "."

# pnpm 11 reads allowBuilds; pnpm 9/10 (Vercel picks pnpm from lockfileVersion) read onlyBuiltDependencies.
allowBuilds:
  "@parcel/watcher": true
  "@playwright/browser-chromium": true
  "@sentry/cli": true
  "@swc/core": true
  "core-js": true
  "esbuild": true
  "protobufjs": true
  "sharp": true
  "supabase": true
  "unix-dgram": true
  "unrs-resolver": true

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@playwright/browser-chromium"
  - "@sentry/cli"
  - "@swc/core"
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - supabase
  - unix-dgram
  - unrs-resolver

# pnpm 11 ignores the "pnpm" field in package.json; pnpm 10+ reads these from here.
# The copy in package.json stays for pnpm 9. Keep both in sync.
