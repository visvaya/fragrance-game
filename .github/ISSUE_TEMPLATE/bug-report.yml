name: Bug report
description: Something in the game does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem, as precisely as you can. Do not include passwords or other personal data.
      placeholder: |
        1. Open the daily puzzle
        2. Skip the first attempt
        3. ...
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Puzzle date
      description: The date of the daily puzzle, if the problem concerns one puzzle.
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari 26; Windows 11, Chrome 140
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Game language
      options:
        - English
        - Polish
