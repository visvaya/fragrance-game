version: 2

# An npm update changes pnpm-lock.yaml, which is deployed, so its pull request must move the version
# like any other change to the app, and the bot cannot: before merging, run
# `pnpm version:bump "<title of the pull request>"` on its branch and push the commit. Dependabot then
# stops rebasing that branch, so refreshes after that are done by hand. Pull requests that touch only
# GitHub Actions, the Python tools or the Docker tools do not ship and keep the version.
#
# Weekly, grouped updates keep the PR count low on a single-maintainer repo.
# Security updates are not grouped here: they arrive on their own as soon as
# an advisory lands, independent of this schedule. `cooldown` waits a week
# after a version is published before proposing it.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    # Direct dependencies are pinned exactly; raise the pin to the new version.
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /.github/semgrep
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: pip
    directory: /tools/zizmor
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: docker
    directories:
      - /tools/actionlint
      - /tools/gitleaks
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
