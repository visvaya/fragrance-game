name: Release

# Push a tag vX.Y.Z to publish a GitHub release. The tag must match the
# "version" field in package.json; bump it first in a chore(release) commit.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

# Two tags pushed together queue instead of cancelling a half-created release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify version and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job writes, and only through the API token passed to gh.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
