name: Integration Tests

on:
  schedule:
    # Run daily at 02:00 UTC (after daily challenge generation at midnight)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration & RLS tests (live DB)
    runs-on: ubuntu-latest
    env:
      # Real Supabase credentials for the read-only RLS tests.
      VITEST_INTEGRATION: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RLS security tests (read-only, safe on production DB)
        run: pnpm vitest run lib/supabase/__tests__/rls-security.test.ts
      # The daily-challenge algorithm suite truncates tables and needs a staging
      # database (TEST_SUPABASE_URL / TEST_SUPABASE_SERVICE_ROLE_KEY). There is none
      # yet, so it is not run here; see docs/known-debt.md.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: coverage/
          retention-days: 7
