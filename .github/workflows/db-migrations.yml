name: Database from migrations

# Builds an empty local database from supabase/migrations and seed.sql, without secrets or access to
# production. PL/pgSQL functions are checked statically (supabase/checks/plpgsql-functions.sql); its
# schema fingerprint must equal production's, kept in supabase/schema-fingerprint.txt; then the pgTAP
# suite and the auth trigger check (supabase/checks) run against it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-from-migrations:
    name: Database from migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start a local database from the migrations
        run: pnpm exec supabase db start
      - name: Check PL/pgSQL functions with plpgsql_check
        # Runs before the fingerprint, so a function error is reported even when the schema changed.
        run: psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/checks/plpgsql-functions.sql
      - name: Lint the schema with the Supabase linter (splinter)
        env:
          # splinter.sql of release 2026.09.1; the same file as main on 2026-11-16. Update both together.
          SPLINTER_COMMIT: e74a9e36cb12258cb67d1464bc1cb196e9cd8446
          SPLINTER_SHA256: d8d558baad3e03832e521c527907fa50a9a172fabd899dd0f5c2504a5a0e9349
        run: |
          set -o pipefail
          curl -fsSL -o "$RUNNER_TEMP/splinter.sql" "https://raw.githubusercontent.com/supabase/splinter/$SPLINTER_COMMIT/splinter.sql"
          echo "$SPLINTER_SHA256  $RUNNER_TEMP/splinter.sql" | sha256sum -c -
          psql "$LOCAL_DB_URL" -X -q --csv -v ON_ERROR_STOP=1 -v splinter="$RUNNER_TEMP/splinter.sql" -f supabase/checks/splinter-run.sql \
            | pnpm exec tsx scripts/db-lint.ts
      - name: Compare the schema fingerprint with production
        run: |
          psql "$LOCAL_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/schema-fingerprint.sql > "$RUNNER_TEMP/schema-fingerprint.txt"
          md5sum supabase/schema-fingerprint.txt "$RUNNER_TEMP/schema-fingerprint.txt"
          diff -u supabase/schema-fingerprint.txt "$RUNNER_TEMP/schema-fingerprint.txt"
      - name: Run pgTAP tests on the local database
        run: pnpm exec supabase test db
      - name: Check the auth triggers on the local database
        # The local stack gives its platform roles the database password.
        run: psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/checks/auth-triggers.sql
