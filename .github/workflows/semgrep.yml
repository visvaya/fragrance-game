on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/semgrep.yml
      - .github/semgrep/requirements.txt
  schedule:
    # random HH:MM to avoid a load spike on GitHub Actions at 00:00
    - cron: 34 23 * * *
name: Semgrep
permissions: {}
# Cancel superseded pull request runs. Other runs get a group of their own (run_id), because a
# shared group keeps one pending run and cancels the rest, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/semgrep/requirements.txt
      # Versions and hashes live in .github/semgrep/requirements.txt (compiled from requirements.in)
      # so Dependabot can update them and pip installs only the reviewed files.
      - run: pip install --require-hashes -r .github/semgrep/requirements.txt
      - run: semgrep ci
