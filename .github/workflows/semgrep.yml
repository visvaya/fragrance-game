on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/semgrep.yml
      - .github/semgrep/requirements.txt
  schedule:
    # random HH:MM to avoid a load spike on GitHub Actions at 00:00
    - cron: 34 23 * * *
name: Semgrep
jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/semgrep/requirements.txt
      # The version lives in .github/semgrep/requirements.txt so Dependabot can update it.
      - run: pip install -r .github/semgrep/requirements.txt
      - run: semgrep ci
