name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: pnpm audit
        # Production dependencies only: dev tooling does not ship; see docs/known-debt.md
        run: pnpm audit --prod --audit-level=high

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-security-check:
    name: Custom Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security-check.py
        run: |
          find . -maxdepth 3 -not -path '*/.*' -type f | xargs -I {} python scripts/security-check.py {}

  supabase-advisors:
    name: Supabase Security Advisor
    # Needs repository secrets, which Dependabot PRs do not receive; a skipped job
    # counts as passing for branch protection. The advisor checks the database, not
    # dependencies, so a dependency update loses nothing here.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Blocks on ERROR-level findings (missing RLS, SECURITY DEFINER views).
      # WARN/INFO findings are printed but do not fail the job.
      - name: Check Security Advisor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/check-advisors.mjs
