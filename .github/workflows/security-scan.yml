name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so the full-history secret scan and the other checks also run without a change.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pull request runs. Other runs get a group of their own (run_id), because a
# shared group keeps one pending run and cancels the rest, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Without it the runner's default Node fails the engines check, and pnpm's warning
      # on stdout would make the braces check below report a false positive.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      # Advisories in production dependencies block the merge. Development-only
      # advisories are reported without blocking, so they cannot hold back a
      # production security update; they are fixed in the next change.
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level=high
      - name: pnpm audit (all dependencies, informational)
        continue-on-error: true
        run: pnpm audit --audit-level=high
      # GHSA-vfj7-8cjw-p6xm is ignored in pnpm-workspace.yaml only because braces
      # is a development-only dependency; fail as soon as that stops being true.
      - name: braces stays out of production dependencies
        run: |
          if [ -n "$(pnpm why braces --prod)" ]; then
            echo "::error::braces is now a production dependency; remove the GHSA-vfj7-8cjw-p6xm ignore and fix it"
            pnpm why braces --prod
            exit 1
          fi

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the pull request's commits through the API.
    permissions:
      contents: read # checkout
      pull-requests: read # list the pull request's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The workflow scanners run in this job because it is a required check, so a workflow
      # finding blocks the merge; versions live in tools/ so Dependabot updates them (pip with
      # hashes, docker with a digest). Both also run after an earlier failure, so one run reports all.
      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan workflows with zizmor
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --quiet --require-hashes --no-deps -r tools/zizmor/requirements.txt
          zizmor --persona pedantic --offline --format github .
      - name: Lint workflows with actionlint
        if: ${{ !cancelled() }}
        run: |
          docker build --quiet --tag actionlint tools/actionlint
          docker run --rm --volume "$PWD:/repo" --workdir /repo actionlint -color
      # The actionlint image carries shellcheck, which also lints the repository's shell scripts.
      - name: Lint shell scripts with shellcheck
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty docker run --rm --volume "$PWD:/repo" --workdir /repo --entrypoint shellcheck actionlint

  supabase-advisors:
    name: Supabase Security Advisor
    # Checks the production project, not the code, so it runs only on main (after merges and on
    # the schedule), where the production-ci environment provides the account token. Pull requests
    # lint the schema with splinter in "Database from migrations".
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Blocks on ERROR-level findings (missing RLS, SECURITY DEFINER views).
      # WARN/INFO findings are printed but do not fail the job. With --remote the CLI reads the
      # advisors through the Management API with the access token, without a database connection.
      - name: Check Security Advisor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: pnpm exec supabase db advisors --remote="$SUPABASE_PROJECT_ID" --type security --fail-on error
