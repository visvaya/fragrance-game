name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      # GHSA-vfj7-8cjw-p6xm is ignored in pnpm-workspace.yaml only because braces
      # is a development-only dependency; fail as soon as that stops being true.
      - name: braces stays out of production dependencies
        run: |
          if [ -n "$(pnpm why braces --prod)" ]; then
            echo "::error::braces is now a production dependency; remove the GHSA-vfj7-8cjw-p6xm ignore and fix it"
            pnpm why braces --prod
            exit 1
          fi

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-security-check:
    name: Custom Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run security-check.py
        run: |
          find . -maxdepth 3 -not -path '*/.*' -type f | xargs -I {} python scripts/security-check.py {}

  supabase-advisors:
    name: Supabase Security Advisor
    # Needs repository secrets, which Dependabot PRs do not receive; a skipped job
    # counts as passing for branch protection. The advisor checks the database, not
    # dependencies, so a dependency update loses nothing here.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Blocks on ERROR-level findings (missing RLS, SECURITY DEFINER views).
      # WARN/INFO findings are printed but do not fail the job.
      - name: Check Security Advisor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/check-advisors.mjs
