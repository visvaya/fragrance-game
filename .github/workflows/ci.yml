name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded pull request runs. Other runs get a group of their own (run_id), because a
# shared group keeps one pending run and cancels the rest, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the text check below can diff against the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      # A squash merge turns the pull request title into the commit on main.
      - name: Pull request title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint
      - name: No new em dashes or emoji
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec tsx scripts/check-text.ts since "origin/$BASE_REF"
      - run: pnpm lint:strict
      - run: pnpm format:check
      # Unused files, exports and dependencies (knip.json).
      - run: pnpm exec knip
      # Markdown rules in .markdownlint-cli2.jsonc; the formatter ignores *.md.
      - run: pnpm lint:markdown
      # Relative links and anchors in Markdown, offline (lychee: external links stay unchecked, so
      # the gate cannot flake). The binary is pinned by checksum.
      - name: Markdown links
        env:
          LYCHEE_URL: https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" "$LYCHEE_URL"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lychee" --offline --include-fragments --no-progress "**/*.md"
      # Any clone fails (jscpd threshold 0 in .jscpd.json).
      - run: pnpm lint:duplicates
      # Every tracked JavaScript file is on the allowlist in scripts/check-typed-files.ts.
      - run: pnpm lint:typed-files
      # Compressed JS of the first screen and packages kept out of start-up (scripts/check-startup-js.ts).
      # Analysis only, no full build; SKIP_ENV_VALIDATION because CI has no app secrets.
      - name: Start-up JS budget
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm budget:startup-js
      # uv installs the versions and hashes from uv.lock; the version matches required-version in
      # pyproject.toml (raise both together).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - name: Python lint, types and tests
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run vulture
          PYTHONPATH=scripts uv run lint-imports
          uv run pytest tests/python -q --cov --cov-report=term
      # Production dependencies of the scripts block; development ones are reported only, so a
      # development advisory never holds back a production fix.
      - name: Python dependency audit
        run: |
          uv export --locked --no-dev --format requirements.txt --no-emit-project -o "$RUNNER_TEMP/req-prod.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req-prod.txt" --progress-spinner off
      - name: Python dependency audit (development, informational)
        continue-on-error: true
        run: |
          uv export --locked --only-dev --format requirements.txt --no-emit-project -o "$RUNNER_TEMP/req-dev.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req-dev.txt" --progress-spinner off

  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
