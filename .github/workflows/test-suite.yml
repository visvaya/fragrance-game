name: Comprehensive Test Suite
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TZ: Europe/Warsaw
  # Production builds require a public origin; CI serves the app on localhost.
  SITE_URL: http://localhost:3000

permissions:
  contents: read

# Cancel superseded pull request runs. Other runs get a group of their own (run_id), because a
# shared group keeps one pending run and cancels the rest, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fast-tests:
    # The unit tests run once, with coverage, in ci.yml; this job runs the RLS tests and the daily
    # challenge generation suite against a local stack built from the migrations and the seed (the
    # nightly integration-tests.yml run repeats the RLS tests on production).
    name: RLS integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The documented local path after checkout; zizmor's $/ form is not in GitHub's docs yet.
      - uses: ./.github/actions/local-supabase # zizmor: ignore[self-repository]
      - name: Run the RLS tests
        run: pnpm exec vitest run lib/supabase/__tests__/rls-security.test.ts
      # Last: the suite empties the catalogue and challenge tables of the local stack.
      - name: Run the daily challenge generation suite
        env:
          TEST_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec vitest run app/api/cron/generate-daily/__tests__/algorithm.integration.test.ts

  playwright-e2e:
    name: Playwright Smoke
    # Needs the Upstash secrets (rate limits), which Dependabot PRs do not receive; a skipped job
    # counts as passing for branch protection. Run it manually before merging such a PR.
    # The database is a local stack built from the migrations and the seed, except on main. Redis
    # stays the production Upstash: @upstash/ratelimit sends Lua scripts with an Upstash-only flag
    # (allow-key-locking) that a plain Redis rejects. Autocomplete cache keys carry the database
    # host, so local and production entries stay apart.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # The production database secrets live in the production-ci environment, which only main can
    # use; other runs take no environment and test on the local stack.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production-ci' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast-tests
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_ASSETS_HOST: ${{ secrets.NEXT_PUBLIC_ASSETS_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Cache Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Build caches only: the data cache (fetch-cache) holds query results such as the daily
          # puzzle, which belong to the database of the run that wrote them.
          path: |
            ${{ github.workspace }}/.next/cache
            !${{ github.workspace }}/.next/cache/fetch-cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Random per run: the app only needs some valid value, and no production secret reaches PR code.
      - name: Generate per-run guest ticket and cron secrets
        run: |
          echo "GUEST_TICKET_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # Pull requests test on a local stack. A push to main gates the production deployment (Vercel
      # Deployment Checks), so there the trusted code runs against the production database.
      # The documented local path after checkout; zizmor's $/ form is not in GitHub's docs yet.
      - uses: ./.github/actions/local-supabase # zizmor: ignore[self-repository]
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      - name: Use the production database
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Build application
        # Caches saved before the data cache was excluded still restore one with production rows.
        run: |
          rm -rf .next/cache/fetch-cache
          pnpm run build
      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      # The smoke project runs only Chromium; the system packages of all browsers took over
      # 15 minutes on a slow apt mirror (2026-11-18).
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run Smoke Tests
        # The full chromium and a11y suites run nightly in e2e-nightly.yml.
        run: pnpm exec playwright test --project=smoke
      - name: Run Accessibility Checks
        # The two axe scans of e2e/a11y/wcag.spec.ts that pass reliably; the login modal scan
        # still runs only nightly.
        run: pnpm exec playwright test --project=chromium --grep "accessibility violations" e2e/a11y/wcag.spec.ts
      # Artifacts are public and not masked like logs: upload only what passed the secret scan.
      - name: Scan the artifact for secrets
        id: secret-scan
        if: always()
        run: .github/scripts/scan-artifacts.sh playwright-report test-results smoke-test-failure.png
      - name: Upload Playwright Report
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            smoke-test-failure.png
          retention-days: 30

  base-code-new-schema:
    name: Base code on the new schema
    # Migrations reach production before the pull request is merged, so the deployed code meets the
    # new schema first. When a pull request changes supabase/migrations, this job starts a local
    # stack from the pull request's migrations and seed and runs the base branch's smoke tests
    # against the base branch's build. Other pull requests stop after the first step.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No needs: it reports on its own even when a migration also breaks the new code's tests.
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_ASSETS_HOST: ${{ secrets.NEXT_PUBLIC_ASSETS_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for changed migrations
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Through a file, so a failing git diff stops the step instead of reading as "no changes".
          git diff --name-only "$BASE_SHA" HEAD -- supabase/migrations > "$RUNNER_TEMP/migrations"
          if [ -s "$RUNNER_TEMP/migrations" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed migrations."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changed.outputs.any == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changed.outputs.any == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.any == 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        if: steps.changed.outputs.any == 'true'
        run: pnpm install --frozen-lockfile
      - name: Generate per-run guest ticket and cron secrets
        if: steps.changed.outputs.any == 'true'
        run: |
          echo "GUEST_TICKET_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # The pull request's migrations and seed, from the workspace root.
      - uses: ./.github/actions/local-supabase # zizmor: ignore[self-repository]
        if: steps.changed.outputs.any == 'true'
      - name: Build the base branch
        if: steps.changed.outputs.any == 'true'
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install Playwright Chromium
        if: steps.changed.outputs.any == 'true'
        working-directory: base
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the base branch's smoke tests
        if: steps.changed.outputs.any == 'true'
        working-directory: base
        run: pnpm exec playwright test --project=smoke
      # Artifacts are public and not masked like logs: upload only what passed the secret scan.
      - name: Scan the artifact for secrets
        id: secret-scan
        if: always() && steps.changed.outputs.any == 'true'
        working-directory: base
        run: .github/scripts/scan-artifacts.sh playwright-report test-results
      - name: Upload Playwright Report
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-base-code
          path: |
            base/playwright-report/
            base/test-results/
          retention-days: 30

  pgtap:
    name: pgTAP (schema + RLS + search)
    # Checks the production database after each merge. Pull requests run the same pgTAP files on
    # a database built from the migrations ("Database from migrations"), and the nightly
    # "Production schema drift" compares production with the migrations.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time across all branches: the Supabase CLI resets the password of its login
    # role and installs pgTAP into the production database only for the duration of a run, so a
    # concurrent run fails with "password authentication failed" or "function plan(integer)
    # does not exist" (both seen 2026-11-16 with two pull requests in flight).
    concurrency:
      group: pgtap-production
      cancel-in-progress: false
    needs: fast-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Run pgTAP tests on linked project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The Supabase pooler sometimes times out its own auth query at login ("EAUTHQUERY",
        # 2026-11-16 and 2026-11-19), which aborts one test file without running it. Retry the
        # run once on that error only; a failing assertion is never retried.
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if pnpm exec supabase test db --yes --remote 2>&1 | tee pgtap.log; then exit 0; fi
            if [ "$attempt" = 2 ] || ! grep -q "EAUTHQUERY" pgtap.log; then exit 1; fi
            echo "::warning::Supabase pooler auth query timed out; retrying the pgTAP run once."
            sleep 20
          done
