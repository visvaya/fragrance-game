name: Production schema drift

# Every change to the production schema goes through supabase/migrations/, so production's
# schema fingerprint must equal supabase/schema-fingerprint.txt. This nightly run catches a
# change made outside migrations (for example in the dashboard). Read-only query.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

# A manual run waits for the nightly one instead of overlapping it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fingerprint:
    name: Production schema fingerprint
    # Production secrets come from the production-ci environment, which only main can use.
    environment: production-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Compare production with the expected fingerprint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm db:fingerprint
