name: E2E Nightly

# The full Playwright suite takes several minutes plus the build, so it runs nightly and on
# demand instead of on every pull request. Pull requests run the blocking smoke tests.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

# A manual run waits for the nightly one instead of overlapping it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Europe/Warsaw
  # Production builds require a public origin; CI serves the app on localhost.
  SITE_URL: http://localhost:3000

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright full suite (chromium + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The database is a local stack built from the migrations and the seed, so test players and
    # games never reach production. Redis stays the production Upstash: the rate limiter's Lua
    # scripts need it, and autocomplete cache keys carry the database host.
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_ASSETS_HOST: ${{ secrets.NEXT_PUBLIC_ASSETS_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Random per run: the app only needs some valid value, and no production secret reaches PR code.
      - name: Generate per-run guest ticket and cron secrets
        run: |
          echo "GUEST_TICKET_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # The documented local path after checkout; zizmor's $/ form is not in GitHub's docs yet.
      - uses: ./.github/actions/local-supabase # zizmor: ignore[self-repository]
      - name: Build application
        run: pnpm run build
      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run chromium suite (excluding visual)
        # Includes the a11y specs (e2e/a11y belongs to the chromium project). Visual snapshots stay
        # excluded: the Linux renderer differs from the Windows baselines.
        run: pnpm exec playwright test --project=chromium --grep-invert "visual"
      # Artifacts are public and not masked like logs: upload only what passed the secret scan.
      - name: Scan the artifact for secrets
        id: secret-scan
        if: always()
        run: .github/scripts/scan-artifacts.sh playwright-report test-results
      - name: Upload Playwright Report
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-nightly
          path: |
            playwright-report/
            test-results/
          retention-days: 14
