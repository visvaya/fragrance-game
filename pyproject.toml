# Python tooling for the data and asset scripts (scripts/, tests/python); the app itself is Node.
# Exact versions, so every change arrives as its own Dependabot pull request.
[project]
name = "eauxle-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.44.0",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "pillow==13.0.0",
  "python-dotenv==1.2.4",
  "supabase==2.34.1",
  "tqdm==4.70.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S is flake8-bandit, so Bandit is not needed.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.uv]
package = false
# The uv version CI runs (.github/workflows/ci.yml) is the local minimum.
required-version = ">=0.13.7"
exclude-newer = "7 days"
