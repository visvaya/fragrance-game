# Python tooling for the data and asset scripts (scripts/, tests/python); the app itself is Node.
# Exact versions, so every change arrives as its own Dependabot pull request.
[project]
name = "eauxle-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.44.0",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "pillow==13.0.0",
  "python-dotenv==1.2.4",
  "supabase==2.34.1",
  "tqdm==4.70.1",
]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pandas-stubs==3.1.0.261029",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "types-tqdm==4.70.0.20261106",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S is flake8-bandit, so Bandit is not needed.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests/python"]
# The scripts are not a package: each directory is put on the import path as tests do.
mypy_path = ["scripts", "scripts/assets"]
explicit_package_bases = true

# boto3 ships no type information; the scripts use it only to build an S3 client for R2.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

# Files not yet typed. The list only shrinks: a file leaves it in the change that types it.
[[tool.mypy.overrides]]
module = ["etl"]
ignore_errors = true

[tool.uv]
package = false
# The uv version CI runs (.github/workflows/ci.yml) is the local minimum.
required-version = ">=0.13.7"
exclude-newer = "7 days"
