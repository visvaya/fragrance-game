# Python tooling for the data and asset scripts (scripts/, tests/python); the app itself is Node.
# Exact versions, so every change arrives as its own Dependabot pull request.
[project]
name = "eauxle-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.44.4",
  "numpy==2.5.5",
  "pandas==3.1.1",
  "pillow==13.0.0",
  "python-dotenv==1.2.4",
  "supabase==2.34.1",
  "tqdm==4.70.1",
]

[dependency-groups]
dev = [
  "import-linter==2.16",
  "mypy==2.4.1",
  "pandas-stubs==3.1.0.261029",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  "types-tqdm==4.70.0.20261106",
  "vulture==2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S is flake8-bandit, so Bandit is not needed.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests/python"]
# The scripts are not a package: each directory is put on the import path as tests do.
mypy_path = ["scripts", "scripts/assets"]
explicit_package_bases = true

# boto3 ships no type information; the scripts use it only to build an S3 client for R2.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
# Ratchet: the measured coverage of scripts/ (2026-11-24: 85.63%; was 58.35% on 2026-11-19), raised with tests, never lowered.
fail_under = 85

[tool.vulture]
# Dead code in the scripts and their tests, at vulture's default confidence (measured 2026-11-19:
# no finding in scripts/). The names below are test doubles: keyword parameters that copy the boto3
# call signature (Bucket) and mock attributes set for the code under test (side_effect).
paths = ["scripts", "tests/python"]
min_confidence = 60
ignore_names = ["Bucket", "side_effect"]

[tool.importlinter]
# The image-pipeline modules are not a package: scripts/assets is analysed as the namespace package
# 'assets' (run with PYTHONPATH=scripts), and their own top-level imports such as r2_client appear
# as external modules, so each pure module is listed as a source and the I/O modules by name.
root_packages = ["assets"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure image-pipeline logic performs no I/O"
type = "forbidden"
source_modules = [
  "assets.asset_keys",
  "assets.asset_publish",
  "assets.rekey_plan",
]
forbidden_modules = [
  "r2_client",
  "rekey_assets",
  "process_game_assets",
  "preprocess_assets",
  "generate_asset_list",
  "boto3",
  "botocore",
  "supabase",
  "PIL",
  "numpy",
  "http",
  "urllib",
  "requests",
  "dotenv",
]

[tool.uv]
package = false
# CI pins the exact uv version (.github/workflows/ci.yml); this floor stays at the minor line,
# because Dependabot runs its own, older uv and refuses to update when the floor is above it.
required-version = ">=0.13"
exclude-newer = "7 days"
